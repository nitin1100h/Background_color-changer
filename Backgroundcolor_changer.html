<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Javascript background-color Changer</title>
  <link rel="stylesheet" href="BackgroundColor_changer.css">
</head>
<body>
  <h1 class="heading" id="first-heading">Background-color Changer</h1>

  <div class="canvas">
    <div class="colors">
      <span class="button" id="black"></span>
      <span class="button" id="grey"></span>
      <span class="button" id="white"></span>
      <span class="button" id="yellow"></span>
    </div>
      <h2>
        Try clicking on the colors above to change the background of the page!
      </h2>
  </div>
</body>
<script src="BackgroundColor_changer.js"></script>
</html>
